name: Unit tests for e2e tests source code

on:
  pull_request:
    branches: [main]
    paths:
      - "e2e-tests/**"
      - ".github/workflows/e2e-unit-tests.yaml"
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}"

      - name: Install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: e2e-tests/go.mod
          cache-dependency-path: e2e-tests/go.sum

      - name: Run unit tests
        working-directory: e2e-tests
        run: go test -count=1 -v .
