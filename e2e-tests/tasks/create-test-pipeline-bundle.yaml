---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-test-pipeline-bundle
spec:
  description: |
    Prepares pipeline bundle references for e2e testing. In task mode, it injects task bundles
    from the SNAPSHOT into released pipeline bundles. In pipeline mode, it uses pipeline bundles
    from the SNAPSHOT as-is and defaults for unchanged pipelines.
  params:
    - name: SNAPSHOT
      type: string
      default: '{"components": [{"name":"task-git-clone", "containerImage": "quay.io/redhat-repo/git-clone@sha256:f27401affdd74d77a9595e2516ebc226ca564b9faf69a5f649bf7687a5a49d20"}]}'
      description: "The name of the secret containing the kubeconfig to access the target cluster."
    - name: snapshot-type
      type: string
      description: "type of the snapshot, for example, group or component"
    - name: component-names
      type: string
      description: "comma seperated name of the components to be updated"
    - name: e2e-bundle-mode
      type: string
      description: >
        task — inject PR task bundle(s) into released pipeline bundles;
        pipeline - use PR pipeline bundle image(s) from the snapshot as-is.
    - name: git-url
      type: string
      default: "https://github.com/konflux-ci/container-build-catalog.git"
      description: Git repository URL containing the PR source.
    - name: git-revision
      type: string
      default: main
      description: Git revision of the PR source to use.
  volumes:
    - name: konflux-ci-secrets-volume
      secret:
        secretName: konflux-e2e-secrets
  results:
    - name: docker-build-pipeline-bundle
      description: "Docker Build Pipeline Bundle Reference"
    - name: docker-build-oci-ta-pipeline-bundle
      description: "Docker Build OCI TA Pipeline Bundle Reference"
    - name: docker-build-oci-ta-min-pipeline-bundle
      description: "Docker Build OCI TA Min Pipeline Bundle Reference"
    - name: docker-build-multi-platform-oci-ta-pipeline-bundle
      description: "Docker Build Multi Platform OCI TA Pipeline Bundle Reference"
    - name: fbc-builder-pipeline-bundle
      description: "Fbc Builder Build Pipeline Bundle Reference"
  steps:
    - name: create-bundle
      image: registry.access.redhat.com/ubi10/go-toolset:1.26.7@sha256:4240036fd19bdad5d72ad15062d80b71cac9bc6b7789a45e53d6cc3e43167165
      workingDir: /workspace/source
      volumeMounts:
        - name: konflux-ci-secrets-volume
          mountPath: /usr/local/konflux-ci-secrets
      securityContext:
        runAsUser: 0
      env:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: GIT_URL
          value: $(params.git-url)
        - name: GIT_REVISION
          value: $(params.git-revision)
      script: |
        #!/bin/bash
        set -euo pipefail

        # Log params
        echo "SNAPSHOT_TYPE: $(params.snapshot-type)"
        echo "COMPONENT_NAMES: $(params.component-names)"
        echo "E2E_BUNDLE_MODE: $(params.e2e-bundle-mode)"
        QUAY_TOKEN="$(cat "/usr/local/konflux-ci-secrets/quay-token")"
        export QUAY_TOKEN

        dnf install -y python3 python3-pip
        python3 -m venv /tmp/venv
        /tmp/venv/bin/pip install "git+https://github.com/konflux-ci/pipeline-migration-tool@v0.9.0"

        go install github.com/mikefarah/yq/v4@latest
        GOPATH_BIN="$(go env GOPATH)/bin"

        export PATH="/tmp/venv/bin:${GOPATH_BIN}:${PATH}"

        git config --global --add safe.directory /workspace/source
        git config --global user.name "redhat-appstudio-qe-bot"
        git config --global user.email redhat-appstudio-qe-bot@redhat.com

        git clone "${GIT_URL}" /workspace/source
        cd /workspace/source
        git checkout "${GIT_REVISION}"

        cd e2e-tests/
        go mod download
        go run . "${SNAPSHOT}" "$(params.snapshot-type)" "$(params.component-names)" "$(params.e2e-bundle-mode)"
