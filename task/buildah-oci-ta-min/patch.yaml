- op: replace
  path: /metadata/name
  value: buildah-oci-ta-min
# kustomize build task/buildah-oci-ta/0.10 | yq '.spec.steps.[].name' | nl -v 0
#      0	use-trusted-artifact
#      1	build
#      2	push
#      3	sbom-syft-generate
#      4	prepare-sboms
#      5	upload-sbom
# StepTemplate
- op: replace
  path: /spec/stepTemplate/computeResources/limits/memory
  value: 256Mi
- op: replace
  path: /spec/stepTemplate/computeResources/requests/memory
  value: 256Mi
- op: replace
  path: /spec/stepTemplate/computeResources/requests/cpu
  value: 100m

# use-trusted-artifact — lean min floor (prod oci-ta uses 256Mi/200m)
- op: test
  path: /spec/steps/0/name
  value: use-trusted-artifact
- op: replace
  path: /spec/steps/0/computeResources/limits/memory
  value: 64Mi
- op: replace
  path: /spec/steps/0/computeResources/requests/memory
  value: 64Mi
- op: replace
  path: /spec/steps/0/computeResources/requests/cpu
  value: 50m

# build step
- op: test
  path: /spec/steps/1/name
  value: build
- op: replace
  path: /spec/steps/1/computeResources/limits/memory
  value: 1Gi
- op: replace
  path: /spec/steps/1/computeResources/requests/memory
  value: 1Gi
- op: replace
  path: /spec/steps/1/computeResources/limits/cpu
  value: 500m
- op: replace
  path: /spec/steps/1/computeResources/requests/cpu
  value: 500m

# prepare-sboms step
- op: test
  path: /spec/steps/2/name
  value: prepare-sboms
- op: replace
  path: /spec/steps/2/computeResources/limits/memory
  value: 256Mi
- op: replace
  path: /spec/steps/2/computeResources/requests/memory
  value: 256Mi
- op: add
  path: /spec/steps/2/computeResources/limits/cpu
  value: 100m
- op: replace
  path: /spec/steps/2/computeResources/requests/cpu
  value: 100m

# upload-sbom step
- op: test
  path: /spec/steps/3/name
  value: upload-sbom
- op: replace
  path: /spec/steps/3/computeResources/limits/memory
  value: 512Mi
- op: replace
  path: /spec/steps/3/computeResources/requests/memory
  value: 512Mi
- op: replace
  path: /spec/steps/3/computeResources/limits/cpu
  value: 100m
- op: replace
  path: /spec/steps/3/computeResources/requests/cpu
  value: 100m
