---
# Note: use-trusted-artifact is an additionalStep (not recipe `add:`) so
# computeResources survive `hack/generate-ta-tasks.sh` / check-ta CI.
# Sized from fleet MAX+5% (15d / 5% margin, 2026-11-12): ~246Mi → 256Mi.
# Lean baseline matching the intended ta-generator default (256Mi/50m) with
# CPU raised to measured MAX+5% (~200m).
base: ../buildah/buildah.yaml
removeParams:
  - BUILDER_IMAGE
newPrefetchNaming: true
removeWorkspaces:
  - source
useTAVolumeMount: true
replacements:
  workspaces.source.path: /var/workdir
regexReplacements:
  "/workspace(/.*)": /var/workdir$1
addParams:
  - name: SOURCE_ARTIFACT
    type: string
    description: The Trusted Artifact URI pointing to the artifact with
      the application source code. This should be the same value as the
      result that was returned from the previous task that produced the
      Trusted Artifact.
  - name: PREFETCH_ARTIFACT
    type: string
    description: The Trusted Artifact URI pointing to the artifact with
      the prefetched dependencies. Empty by default for builds without
      prefetch.
    default: ""
additionalSteps:
  - at: 0
    name: use-trusted-artifact
    image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:6df16e808f147926a2ba5f88588350bd8f77e73fde43614e79ddbd6e2b097d2e
    args:
      - use
      - $(params.SOURCE_ARTIFACT)=/var/workdir/source
      - $(params.PREFETCH_ARTIFACT)=/var/workdir/prefetch
    computeResources:
      limits:
        memory: 256Mi
      requests:
        cpu: 200m
        memory: 256Mi
