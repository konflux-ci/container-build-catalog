---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-git-clone-with-tag
spec:
  description: |
    Test the git-clone task with tag
  workspaces:
    - name: tests-workspace
  tasks:
    - name: run-task
      taskRef:
        name: git-clone
      params:
        - name: url
          value: https://github.com/konflux-ci/build-definitions
        - name: revision
          value: v0.1.5
      workspaces:
        - name: output
          workspace: tests-workspace
    - name: check-result
      workspaces:
        - name: output
          workspace: tests-workspace
      taskSpec:
        steps:
          - name: check-result
            image: quay.io/konflux-ci/task-runner:3.2.0@sha256:ba5789d2bc04146431e492083c67b86de26d5b17891dc27f67db850a397b66d3
            script: |
              #!/usr/bin/env sh
              set -eux
              files=$(find "$(workspaces.output.path)/source/" -mindepth 1 -maxdepth 1)
              test -n "$files"
      runAfter:
        - run-task
