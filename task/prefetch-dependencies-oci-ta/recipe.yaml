---
base: ../prefetch-dependencies/prefetch-dependencies.yaml
add:
  - use-source
  - create-source
  - create-prefetch
newPrefetchNaming: true
additionalSteps:
  - at: 0
    name: skip-ta
    image: quay.io/konflux-ci/task-runner:4.0.0@sha256:ab7440e1101af1ff0418e16badede2f1590664d3189099030bf3f782371bd9da
    when:
      - input: $(params.input)
        operator: in
        values: [""]
    env:
      - name: SOURCE_ARTIFACT
        value: $(params.SOURCE_ARTIFACT)
    computeResources:
      limits:
        memory: 64Mi
      requests:
        cpu: 50m
        memory: 64Mi
    script: |
      #!/bin/bash

      echo -n "${SOURCE_ARTIFACT}" > "$(results.SOURCE_ARTIFACT.path)"
      echo -n "" > "$(results.PREFETCH_ARTIFACT.path)"
stepWhen:
  use-trusted-artifact:
    - input: $(params.input)
      operator: notin
      values: [""]
  create-trusted-artifact:
    - input: $(params.input)
      operator: notin
      values: [""]
preferStepTemplate: true
removeWorkspaces:
  - source
replacements:
  workspaces.source.path: /var/workdir
useTAVolumeMount: true
