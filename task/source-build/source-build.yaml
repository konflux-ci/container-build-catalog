---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: source-build
  labels:
    app.kubernetes.io/version: "0.5.0"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: "konflux"
spec:
  description: Source image build.
  params:
    - name: BINARY_IMAGE
      description: Binary image name with tag.
      type: string
    - name: BINARY_IMAGE_DIGEST
      description: Digest of the binary image.
      type: string
    - name: BASE_IMAGES
      description: >-
        By default, the task inspects the SBOM of the binary image to find the base image.
        With this parameter, you can override that behavior and pass the base image directly.
        The value should be a newline-separated list of images, in the same order as the FROM
        instructions specified in a multistage Dockerfile.
      type: string
      default: ""
    - name: IGNORE_UNSIGNED_IMAGE
      description: When set to "true", source build task won't fail
        when source image is missing signatures (this can be used for
        development)
      type: string
      default: "false"
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from.
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data.
      default: ca-bundle.crt
  results:
    - name: BUILD_RESULT
      description: Build result.
    - name: SOURCE_IMAGE_URL
      description: The source image url.
    - name: SOURCE_IMAGE_DIGEST
      description: The source image digest.
    - name: IMAGE_REF
      description: Image reference of the built image.
  workspaces:
    - name: workspace
      description: The workspace where source code is included.
  volumes:
    - name: source-build-work-place
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    env:
      - name: BINARY_IMAGE
        value: "$(params.BINARY_IMAGE)"
      - name: BINARY_IMAGE_DIGEST
        value: "$(params.BINARY_IMAGE_DIGEST)"
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - name: source-build-work-place
        mountPath: /var/source-build
      - name: trusted-ca
        mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
        subPath: ca-bundle.crt
        readOnly: true
  steps:
    - name: build
      image: quay.io/mkosiarc_rhtap/konflux-build-cli:scb-test@sha256:07f97d143f68d2d7bd7856d0bb44feada417febf3e372b733e0ae2a79a7a2c79
      # per https://kubernetes.io/docs/concepts/containers/images/#imagepullpolicy-defaulting
      # the cluster will set imagePullPolicy to IfNotPresent
      computeResources:
        limits:
          memory: 2Gi
        requests:
          memory: 2Gi
          cpu: 250m
      workingDir: "/var/source-build"
      securityContext:
        runAsUser: 0
        capabilities:
          add:
            - SETFCAP
      env:
        - name: BASE_IMAGES
          value: "$(params.BASE_IMAGES)"
        - name: IGNORE_UNSIGNED_IMAGE
          value: "$(params.IGNORE_UNSIGNED_IMAGE)"
        - name: RESULT_FILE
          value: "$(results.BUILD_RESULT.path)"
        - name: WS_BUILD_RESULT_FILE
          value: "$(workspaces.workspace.path)/source_build_result.json"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        ## Red Hat publishes the signatures of its source images as detached
        ## signatures in a lookaside, not as sigstore attachments in the
        ## registry. RHEL 10, which this image is based on, only looks for the
        ## latter by default, so pulling the sources of a Red Hat base image
        ## fails with "A signature was required, but no signature exists".
        ##
        ## Verify them the way RHEL 9 did instead, which is how this task
        ## verified them before it moved to this image. This checks the same
        ## signatures against the same keys, it does not skip the check.
        ##
        policy_dir=/var/source-build/signature-policy
        mkdir -p "${policy_dir}/registries.d"

        cat >"${policy_dir}/policy.json" <<'EOF'
        {
            "default": [{"type": "insecureAcceptAnything"}],
            "transports": {
                "docker": {
                    "registry.access.redhat.com": [
                        {
                            "type": "signedBy",
                            "keyType": "GPGKeys",
                            "keyPaths": [
                                "/etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release",
                                "/etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-beta"
                            ]
                        }
                    ],
                    "registry.redhat.io": [
                        {
                            "type": "signedBy",
                            "keyType": "GPGKeys",
                            "keyPaths": [
                                "/etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release",
                                "/etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-beta"
                            ]
                        }
                    ]
                },
                "docker-daemon": {"": [{"type": "insecureAcceptAnything"}]}
            }
        }
        EOF

        cat >"${policy_dir}/registries.d/redhat.yaml" <<'EOF'
        docker:
             registry.access.redhat.com:
                 sigstore: https://access.redhat.com/webassets/docker/content/sigstore
             registry.redhat.io:
                 sigstore: https://registry.redhat.io/containers/sigstore
        EOF

        konflux-build-cli image source-container-build \
          --binary-image-url "$BINARY_IMAGE" \
          --binary-image-digest "$BINARY_IMAGE_DIGEST" \
          --source-dir "$(workspaces.workspace.path)/source" \
          --workspace-dir /var/source-build \
          --prefetch-artifacts-dir "$(workspaces.workspace.path)/prefetch" \
          --base-images "$BASE_IMAGES" \
          --ignore-unsigned-image="$IGNORE_UNSIGNED_IMAGE" \
          --registry-allowlist registry.access.redhat.com \
          --registry-allowlist registry.redhat.io \
          --signature-policy "${policy_dir}/policy.json" \
          --signature-registries-dir "${policy_dir}/registries.d" \
          --result-path-build-result "$(results.BUILD_RESULT.path)" \
          --result-path-source-image-url "$(results.SOURCE_IMAGE_URL.path)" \
          --result-path-source-image-digest "$(results.SOURCE_IMAGE_DIGEST.path)" \
          --result-path-image-ref "$(results.IMAGE_REF.path)"

        cp "$RESULT_FILE" "$WS_BUILD_RESULT_FILE"
